name: Verificar fontes Netshoes e Centauro
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['inspect-sources.mjs', '.github/workflows/inspect-sources.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node inspect-sources.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: retailer-diagnostics
          path: diagnostics
          retention-days: 1
