name: Coletar preços e publicar painel
on:
  workflow_dispatch:
    inputs:
      retailer_pilot:
        description: 'Testar CORRE 5 U em Netshoes e Centauro (até 8 páginas Firecrawl)'
        type: boolean
        default: false
      retailer_batch:
        description: 'Consultar próximo lote de 5 agrupadores de tênis (até 10 páginas Firecrawl)'
        type: boolean
        default: false
      retailer_brand:
        description: 'Marca do lote de tênis'
        type: string
        default: 'OLYMPIKUS'
  schedule:
    - cron: '23 9 * * *'
  push:
    branches: [main]
    paths: ['coletor.mjs', 'coletor.test.mjs', 'retailer-pilot.mjs', 'retailer-pilot.test.mjs', 'retailer-cache.mjs', 'retailer-cache.test.mjs', 'data/**', 'run-collection.mjs', 'config.json', 'public/**', '.github/workflows/coletar-precos.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: painel-precos
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar lógica do coletor
        run: node --test coletor.test.mjs retailer-pilot.test.mjs retailer-cache.test.mjs
      - name: Consultar preços reais
        run: node run-collection.mjs
        env:
          RETAILER_PILOT: ${{ github.event_name == 'workflow_dispatch' && inputs.retailer_pilot }}
          RETAILER_BATCH: ${{ github.event_name == 'workflow_dispatch' && inputs.retailer_batch }}
          RETAILER_BRAND: ${{ inputs.retailer_brand || 'OLYMPIKUS' }}
          FIRECRAWL_API_KEY: ${{ github.event_name == 'workflow_dispatch' && (inputs.retailer_pilot || inputs.retailer_batch) && secrets.FIRECRAWL_API_KEY || '' }}
      - name: Sincronizar configuração pública
        run: cp config.json public/config.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publicar painel
        id: deploy
        uses: actions/deploy-pages@v4
