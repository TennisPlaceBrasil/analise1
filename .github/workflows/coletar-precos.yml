name: Processar fila solicitada e publicar painel
on:
  workflow_dispatch:
  issues:
    types: [opened]
  schedule:
    - cron: '23 * * * *'
  push:
    branches: [main]
    paths: ['*.mjs', 'config.json', 'public/**', '.github/workflows/coletar-precos.yml']
permissions:
  contents: read
  pages: write
  id-token: write
  issues: write
concurrency:
  group: painel-precos
  cancel-in-progress: false
jobs:
  collect:
    if: github.event_name != 'issues' || (startsWith(github.event.issue.title, '[Pesquisa TP] ') && (github.event.issue.author_association == 'OWNER' || github.event.issue.author_association == 'MEMBER' || github.event.issue.author_association == 'COLLABORATOR'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar coletor e fila
        run: node --test coletor.test.mjs retailer-pilot.test.mjs retailer-cache.test.mjs request-queue.test.mjs run-collection.test.mjs offer-selection.test.mjs public-ui.test.mjs
      - name: Preservar resultados e processar solicitações
        run: node run-collection.mjs
        env:
          PROCESS_QUEUE: ${{ github.event_name != 'push' }}
          FIRECRAWL_API_KEY: ${{ github.event_name != 'push' && secrets.FIRECRAWL_API_KEY || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: cp config.json public/config.json
      - uses: actions/upload-artifact@v4
        with:
          name: processed-requests
          path: processed-requests.json
          retention-days: 1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publicar painel
        id: deploy
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: processed-requests
      - name: Concluir solicitações publicadas
        run: node finish-requests.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
