name: Diagnosticar consulta oficial Olympikus
on:
  push:
    branches: [main]
    paths: ['maintenance/probe-request.json']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node maintenance/probe-official.mjs
